<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD6E7;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FFAAC5;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FFB8D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8FAB;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background with gradient -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#warmGradient)"/>

  <!-- Large centered heart -->
  <path d="M 512 380
    C 512 380, 330 280, 330 180
    C 330 120, 370 80, 420 80
    C 460 80, 495 105, 512 140
    C 529 105, 564 80, 604 80
    C 654 80, 694 120, 694 180
    C 694 280, 512 380, 512 380 Z"
    fill="white" opacity="0.98"/>

  <!-- Heart inner glow -->
  <path d="M 512 380
    C 512 380, 330 280, 330 180
    C 330 120, 370 80, 420 80
    C 460 80, 495 105, 512 140
    C 529 105, 564 80, 604 80
    C 654 80, 694 120, 694 180
    C 694 280, 512 380, 512 380 Z"
    fill="none" stroke="#FFCDE2" stroke-width="8" opacity="0.4"/>

  <!-- Sparkle top-left -->
  <g transform="translate(100, 90)">
    <rect x="-4" y="-12" width="8" height="24" fill="white" opacity="0.95"/>
    <rect x="-12" y="-4" width="24" height="8" fill="white" opacity="0.95"/>
  </g>

  <!-- Sparkle top-right -->
  <g transform="translate(924, 85)">
    <rect x="-3" y="-9" width="6" height="18" fill="white" opacity="0.85"/>
    <rect x="-9" y="-3" width="18" height="6" fill="white" opacity="0.85"/>
  </g>

  <!-- Sparkle bottom-left -->
  <g transform="translate(95, 945)">
    <rect x="-4" y="-14" width="8" height="28" fill="white" opacity="0.90"/>
    <rect x="-14" y="-4" width="28" height="8" fill="white" opacity="0.90"/>
  </g>

  <!-- Sparkle bottom-right -->
  <g transform="translate(930, 950)">
    <rect x="-3" y="-8" width="6" height="16" fill="white" opacity="0.80"/>
    <rect x="-8" y="-3" width="16" height="6" fill="white" opacity="0.80"/>
  </g>
</svg>
